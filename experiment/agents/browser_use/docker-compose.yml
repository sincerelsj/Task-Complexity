# docker-compose.yml — browser-use runner for Task_Complexity.
#
# Prereq: build the shared base image first:
#   cd ../  (= agents/)
#   docker build -f _base/Dockerfile -t task-complexity/agents-base:latest .

services:
  agent:
    build:
      context: ..
      dockerfile: browser_use/Dockerfile
    image: task-complexity/brouse:latest
    environment:
      EXPERIMENT_PRICING_JSON: "${EXPERIMENT_PRICING_JSON:-}"
      # Default LLM: Anthropic. Set whichever key matches the model selected
      # via --agent-model. The runner inspects the model name to pick the
      # provider, so all three keys are forwarded if available.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      # Aspect ratio matched to pixel frameworks (1920:1200 = 1280:800 = 16:10).
      # See agents/claude_in_chrome/docker-compose.yml comment for rationale.
      WIDTH: "1920"
      HEIGHT: "1200"
      DISPLAY: ":1"
      DISPLAY_NUM: "1"
      # browser-use launches its own Chromium via Playwright.
      SKIP_CHROMIUM_AUTO_OPEN: "1"
    ports:
      - "6080:6080"
    volumes:
      - "../../logs/agent_traces:/workspace/traces"
    shm_size: "2gb"
    stdin_open: true
    tty: true
