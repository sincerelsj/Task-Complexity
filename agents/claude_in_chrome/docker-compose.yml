# docker-compose.yml — Claude-in-Chrome runner for Task_Complexity.
#
# Prereq: build the shared base image first:
#   cd ../  (= agents/)
#   docker build -f _base/Dockerfile -t task-complexity/agents-base:latest .

services:
  agent:
    build:
      context: ..
      dockerfile: claude_in_chrome/Dockerfile
    image: task-complexity/cldcr:latest
    environment:
      EXPERIMENT_PRICING_JSON: "${EXPERIMENT_PRICING_JSON:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      # Aspect ratio matched to pixel frameworks (1920:1200 = 1280:800 = 16:10).
      # CDP frameworks set Playwright viewport = (WIDTH, HEIGHT) so model sees
      # exactly this resolution; keeping 16:10 across all 6 frameworks lets the
      # experiment screen render identically (academic comparability).
      WIDTH: "1920"
      HEIGHT: "1200"
      DISPLAY: ":1"
      DISPLAY_NUM: "1"
      # The Playwright-managed Chromium is launched by the runner itself.
      # Tell the entrypoint not to pre-open the system chromium.
      SKIP_CHROMIUM_AUTO_OPEN: "1"
    ports:
      - "6080:6080"
    volumes:
      - "../../logs/agent_traces:/workspace/traces"
      - "~/.anthropic:/home/computeruse/.anthropic"
    shm_size: "2gb"
    stdin_open: true
    tty: true
